name = "OpenUI"
grammar = "openui"
path_suffixes = ["gpui-story", "openui"]
line_comments = ["# ", "// "]
tab_size = 2
autoclose_before = ",:.=}])"
brackets = [
    { start = "{", end = "}", close = true, newline = true },
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false, not_in = ["comment", "string"] },
    { start = "'", end = "'", close = true, newline = false, not_in = ["comment", "string"] },
]
